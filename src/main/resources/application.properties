spring.application.name=scaleup-backend

server.port=${PORT:8080}

# =========================================================
# DATABASE
# =========================================================

spring.datasource.url=${DB_URL:${JDBC_DATABASE_URL}}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# =========================================================
# JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Don't emit SQL into production logs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info

# Do not expose database/internal component details publicly.
management.endpoint.health.show-details=never

# =========================================================
# HIGHLEVEL
# =========================================================

highlevel.base-url=${HIGHLEVEL_BASE_URL:https://services.leadconnectorhq.com}

highlevel.internal-crm.location-id=${HIGHLEVEL_INTERNAL_CRM_LOCATION_ID}
highlevel.internal-crm.token=${HIGHLEVEL_INTERNAL_CRM_TOKEN}

highlevel.webhook.secret=${HIGHLEVEL_WEBHOOK_SECRET}

# =========================================================
# HIGHLEVEL HTTP
# =========================================================

highlevel.http.connect-timeout-ms=${HIGHLEVEL_CONNECT_TIMEOUT_MS:5000}
highlevel.http.read-timeout-ms=${HIGHLEVEL_READ_TIMEOUT_MS:15000}

# =========================================================
# CRM RETRY WORKERS
# =========================================================

crm.internal.retry.worker-delay-ms=${CRM_INTERNAL_RETRY_DELAY_MS:60000}
crm.agency.retry.worker-delay-ms=${CRM_AGENCY_RETRY_DELAY_MS:60000}

# Async executor
app.async.core-pool-size=${ASYNC_CORE_POOL_SIZE:4}
app.async.max-pool-size=${ASYNC_MAX_POOL_SIZE:12}
app.async.queue-capacity=${ASYNC_QUEUE_CAPACITY:200}
app.async.shutdown-wait-seconds=${ASYNC_SHUTDOWN_WAIT_SECONDS:30}

# Internal API security
security.internal-api-key=${INTERNAL_API_KEY}

app.cors.public-frontend-origin=${PUBLIC_FRONTEND_ORIGIN:http://localhost:5173}

security.credential-encryption-key=${CREDENTIAL_ENCRYPTION_KEY}